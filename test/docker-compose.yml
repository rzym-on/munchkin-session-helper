version: '3'
services:
  server_munchkin:
    container_name: server.munchkin.sh
    image: ghcr.io/rzym-on/msh-server:latest
    ports:
      - "9000:2567"
    env_file: ./server/.env
  app_munchkin:
    container_name: app.grand.munchkin.sh
    image: ghcr.io/rzym-on/msh-frontend:latest
    ports:
      - "9001:4001"
    volumes:
     - ./config.json:/app/config.json